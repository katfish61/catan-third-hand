function preRollKnightPrompt(){
  const cands = knightRobCandidates();
  return `${STRATEGY_PRIMER}

You are ${game.players.find(p=>p.isClaude).name} in 3-player base Catan, about to roll. You hold a playable Knight.
STATE: ${JSON.stringify(claudeStateView())}
Hexes you may move the robber to (id : description), and who has a building there you could rob:
${JSON.stringify(hexRobInfo())}
Playing the Knight now lets you move the robber before production and steal 1 card; it also counts toward Largest Army.
Reply ONLY minified JSON: {"play":true|false,"moveRobberToHexId":<id>,"robPlayerName":"<name or none>","reason":"short"}`;
}
function robberPrompt(){
  return `${STRATEGY_PRIMER}

You are ${game.players.find(p=>p.isClaude).name}. You rolled a 7 in 3-player base Catan and must move the robber and steal.
STATE: ${JSON.stringify(claudeStateView())}
Hex options and robbable players there: ${JSON.stringify(hexRobInfo())}
Reply ONLY minified JSON: {"moveRobberToHexId":<id>,"robPlayerName":"<name or none>","reason":"short"}`;
}
function tradeReplyPrompt(offer){
  return `${STRATEGY_PRIMER}

You are ${game.players.find(p=>p.isClaude).name} in 3-player base Catan. A human player offers you a trade.
They will GIVE you: ${JSON.stringify(offer.give)}
They want to RECEIVE from you: ${JSON.stringify(offer.get)}
Offering player: ${offer.fromName}
STATE: ${JSON.stringify(claudeStateView())}
Only accept if it helps you more than them and doesn't push anyone toward winning. You must actually hold what they want.
Reply ONLY minified JSON: {"decision":"accept"|"decline"|"counter","counter":{"give":{...from them...},"get":{...from you...}},"reason":"short"}`;
}
function hexRobInfo(){
  const g=game.board.geom, b=allBuildings(), out=[];
  for(let id=1;id<=19;id++){
    if(id===game.board.robberHex) continue;
    const h=game.board.hexes[id-1];
    const who=new Set();
    for(const k in g.verts){
      if(!g.verts[k].hexes.includes(id) || !b[k]) continue;
      const p=playerById(b[k].pid);
      if(!p.isClaude && p.cardCount>0) who.add(p.name);
    }
    out.push({hexId:id, tile: h.resource==="desert"?"desert":RES_META[h.resource].label+"-"+h.token, pips:pips(h.token), robbable:[...who]});
  }
  return out;
}
function knightRobCandidates(){ return hexRobInfo().flatMap(x=>x.robbable); }
function claudePlayableKnight(){
  const cl=game.players.find(p=>p.isClaude);
  return (cl.devCards||[]).some(d=>d.type==="knight" && d.boughtTurn<game.turn) && !cl.playedDevThisTurn;
}
function cleanMap(m){ const o={wood:0,brick:0,sheep:0,wheat:0,ore:0}; if(m) for(const r of RES) o[r]=Math.max(0,Math.round(+m[r]||0)); return o; }

/* ---- setup ---- */
async function claudeSetupPlace(){
  if(ui.busy || game.phase!=="setup" || game.setup.pickStarter) return;
  const pid=game.setup.order[game.setup.step];
  if(!playerById(pid) || !playerById(pid).isClaude) return;
  ui.busy=true; render();
  try{
    const legalV = legalSettlementVertices(pid,{setup:true});
    const prompt = `${STRATEGY_PRIMER}

You are ${playerById(pid).name} placing your ${game.setup.step<3?"FIRST":"SECOND"} settlement + road in 3-player base Catan setup.${game.setup.step>=3?" This settlement grants starting resources from its adjacent tiles.":""}
BOARD: ${JSON.stringify(game.board.hexes.map(h=>({id:h.id, tile:h.resource==="desert"?"desert":RES_META[h.resource].label, token:h.token, pips:pips(h.token)})))}
PORTS: ${JSON.stringify(game.board.ports.map(p=>({type:p.type, at:p.verts.map(vDesc)})))}
EXISTING PLACEMENTS: ${JSON.stringify(game.players.map(p=>({name:p.name, settlements:p.settlements.map(vDesc), roads:p.roads.length})))}
LEGAL SETTLEMENT SPOTS (key : tiles it touches):
${JSON.stringify(legalV.map(k=>({key:k, touches:vDesc(k), adjacentRoadEdges:game.board.geom.verts[k].adjEdges})))}
Reply ONLY minified JSON: {"vertex":"<key from the list>","road":"<one adjacentRoadEdges key of that vertex>","reason":"short"}`;
    const res = await askJSON(prompt,"complex");
    let v = legalV.includes(res?.vertex) ? res.vertex : legalV[bestSetupVertex(legalV)];
    placeSetupSettlement(pid, v);
    const legalR = legalRoadEdges(pid,{setup:true,fromVertex:v});
    let e = legalR.includes(res?.road) ? res.road : legalR[0];
    if(res?.reason) logLine("Claude: "+String(res.reason).slice(0,160),"claude");
    placeSetupRoad(pid, e);
  }catch(err){
    ui.busy=false;
    logLine("Claude setup failed ("+(err.code||err.message||err)+"). Placing a reasonable spot.","claude");
    const legalV = legalSettlementVertices(pid,{setup:true});
    const v=legalV[bestSetupVertex(legalV)];
    placeSetupSettlement(pid,v);
    const legalR=legalRoadEdges(pid,{setup:true,fromVertex:v});
    placeSetupRoad(pid, legalR[0]);
  }finally{ ui.busy=false; }
}
function bestSetupVertex(keys){
  let bi=0,bs=-1;
  keys.forEach((k,i)=>{
    let s=0; const seen=new Set();
    for(const id of game.board.geom.verts[k].hexes){ const h=game.board.hexes[id-1]; if(h.resource==="desert")continue; s+=pips(h.token); seen.add(h.resource); }
    s += seen.size*1.5;
    if(s>bs){bs=s;bi=i;}
  });
  return bi;
}

/* ---- full turn ---- */
async function runClaudeTurn(){
  // once Claude has rolled this turn, this cannot start again — use resumeClaudeTurn()
  if(!game || game.phase!=="play" || game.pickPlayFirst || !cur().isClaude || ui.busy || game.pending || game.pendingRoll!=null) return;
  ui.busy=true; ui.cancelClaude=false; ui.claudeResume=()=>{ claudeMainPhase(); };
  render();
  try{
    if(claudePlayableKnight()){
      const dec = await askJSON(preRollKnightPrompt(),"default").catch(()=>null);
      if(dec && dec.play===true){ await claudePlayKnight(dec); }
      if(ui.cancelClaude){ ui.busy=false; commit(); return; }
      if(game.pending && game.pending.step==="stealReveal"){ ui.claudeResume=claudeRollAndContinue; ui.busy=false; render(); return; }
    }
    await claudeRollAndContinue();
  }catch(err){
    ui.busy=false;
    logLine("Claude's turn was interrupted ("+(err.code||err.message||err)+"). Use “Resume Claude's turn”.","claude");
    commit();
  }
}
async function resumeClaudeTurn(){
  if(!game || game.phase!=="play" || !cur().isClaude || ui.busy || game.pending) return;
  ui.busy=true; ui.cancelClaude=false; ui.claudeResume=()=>{ claudeMainPhase(); };
  render();
  try{ await claudeRollAndContinue(); }
  catch(err){
    ui.busy=false;
    logLine("Claude's turn was interrupted again ("+(err.code||err.message||err)+"). Use “Resume Claude's turn” or “End Claude's turn”.","claude");
    commit();
  }
}
async function claudeRollAndContinue(){
  ui.busy=true; render();
  if(game.pendingRoll==null){
    let n;
    for(let tries=0; tries<25; tries++){
      n=(rint(6)+1)+(rint(6)+1);
      game.rng.log.push({kind:"roll",n});
      if(!(n===7 && game.round<=game.config.protectRounds)) break;
      logLine("Claude rolled 7 — rolling again (house rule).","claude");
    }
    resolveRoll(n,true);
    if(game.pendingRoll==null){ ui.busy=false; render(); return; } // safety: still a protected 7
  }
  if(game.pending && game.pending.type==="robber"){
    if(game.pending.discards.some(d=>!d.done)){ ui.busy=false; render(); return; }
    ui.claudeResume=null;
    await claudeRobberDecision();
    if(game.pending && game.pending.step==="stealReveal"){ ui.claudeResume=()=>{ claudeMainPhase(); }; ui.busy=false; render(); return; }
    game.pending=null;
  }
  await claudeMainPhase();
}
async function claudePlayKnight(dec){
  const cl=game.players.find(p=>p.isClaude);
  const di=(cl.devCards||[]).findIndex(d=>d.type==="knight"&&d.boughtTurn<game.turn);
  if(di<0) return;
  cl.devCards.splice(di,1); cl.devCount=Math.max(0,cl.devCount-1);
  cl.knightsPlayed++; cl.playedDevThisTurn=true;
  logLine("Claude plays a Knight before rolling.","claude");
  updateLargestArmy();
  game.pending={type:"robber", mover:cl.id, discards:[], step:"move"};
  await resolveClaudeRobber(dec);
}
async function claudeRobberDecision(){
  try{ const dec = await askJSON(robberPrompt(),"default"); await resolveClaudeRobber(dec); }
  catch(e){ await resolveClaudeRobber(null); }
}
async function resolveClaudeRobber(dec){
  const cl=game.players.find(p=>p.isClaude);
  let hex = (dec && +dec.moveRobberToHexId>=1 && +dec.moveRobberToHexId<=19 && +dec.moveRobberToHexId!==game.board.robberHex) ? +dec.moveRobberToHexId : null;
  if(hex==null){
    // fallback: highest-pip tile touched by a leading opponent
    const info=hexRobInfo().filter(x=>x.robbable.length).sort((a,b)=>b.pips-a.pips);
    hex = info[0]? info[0].hexId : hexRobInfo().sort((a,b)=>b.pips-a.pips)[0].hexId;
  }
  moveRobber(hex);
  if(dec?.reason) logLine("Claude: "+String(dec.reason).slice(0,160),"claude");
  const cands=game.pending.stealCandidates||[];
  let target = cands.find(pid=>playerById(pid).name===(dec&&dec.robPlayerName));
  if(!target && cands.length){
    // rob the highest publicVP, then most cards
    target = cands.slice().sort((a,b)=> publicVP(playerById(b))-publicVP(playerById(a)) || playerById(b).cardCount-playerById(a).cardCount)[0];
  }
  doSteal(target || "none");
}

async function claudeMainPhase(){
  ui.busy=true; render();
  let res;
  try{ res = await askJSON(turnPrompt(false),"complex"); }
  catch(err){ ui.busy=false; logLine("Claude's move request failed ("+(err.code||err.message||err)+"). Retry with the button.","claude"); commit(); return; }
  const actions = Array.isArray(res && res.actions) ? res.actions : [];
  const offers=[];
  for(const a of actions){
    if(ui.cancelClaude) break;
    if(a && a.type==="proposeTrade"){ offers.push({give:cleanMap(a.give), get:cleanMap(a.get), to:a.toPlayerName||"any", reason:a.reason||""}); continue; }
    let r2; try{ r2=applyClaudeAction(a); }catch(e){}
    if(r2==="PAUSE"){ ui.busy=false; commit(); return; }   // e.g. Monopoly: humans enter amounts, then ui.claudeResume re-runs this
    if(game.phase==="over"){ ui.busy=false; commit(); return; }
  }
  if(res && res.endReason) logLine("Claude: "+String(res.endReason).slice(0,180),"claude");
  ui.busy=false;
  if(offers.length){ game.pending={type:"claudeOffers", offers, anyAccepted:false}; commit(); return; }
  endTurn();
}
function afterClaudeOffers(){
  const acc = game.pending===null ? ui._offersAccepted : false;
  ui._offersAccepted=false;
  if(acc) claudeMainPhase(); else endTurn();
}
function acceptClaudeOffer(i,hid){
  const o=game.pending.offers[i]; if(!o) return;
  const cl=game.players.find(p=>p.isClaude), h=playerById(hid);
  if(!RES.every(r=>cl.hand[r]>=o.give[r])){ flash("Claude no longer holds that — offer withdrawn."); game.pending.offers.splice(i,1); if(!game.pending.offers.length){game.pending=null;afterClaudeOffers();}else commit(); return; }
  if(sum(o.get)>h.cardCount){ flash(`${h.name} doesn't have those cards.`); return; }
  for(const r of RES){ cl.hand[r]-=o.give[r]; cl.hand[r]+=o.get[r]; }
  cl.cardCount=sum(cl.hand);
  h.cardCount += sum(o.give) - sum(o.get);
  logLine(`${h.name} accepts Claude's trade: Claude gives ${RES.filter(r=>o.give[r]).map(r=>o.give[r]+" "+RES_META[r].label).join(", ")||"nothing"}, gets ${RES.filter(r=>o.get[r]).map(r=>o.get[r]+" "+RES_META[r].label).join(", ")||"nothing"}.`,"claude");
  ui._offersAccepted=true;
  game.pending.offers.splice(i,1);
  if(!game.pending.offers.length){ game.pending=null; afterClaudeOffers(); }
  else commit();
}

/* ---- execute one planned action (very defensive) ---- */
function applyClaudeAction(a){
  if(!a || !a.type) return;
  const cl=game.players.find(p=>p.isClaude);
  switch(a.type){
    case "buildRoad":
      if(legalRoadEdges(cl.id).includes(a.edge) && canAffordCount(cl,COST.road) && cl.roads.length<15) placeRoad(cl.id,a.edge,false);
      else logLine("Claude wanted a road it couldn't place — skipped.","claude");
      break;
    case "buildSettlement":
      if(legalSettlementVertices(cl.id).includes(a.vertex) && canAffordCount(cl,COST.settlement) && cl.settlements.length<5) placeSettlement(cl.id,a.vertex);
      else logLine("Claude wanted a settlement it couldn't place — skipped.","claude");
      break;
    case "buildCity":
      if(cl.settlements.includes(a.vertex) && canAffordCount(cl,COST.city) && cl.cities.length<4) placeCity(cl.id,a.vertex);
      else logLine("Claude wanted a city it couldn't build — skipped.","claude");
      break;
    case "buyDev":
      if(canAffordCount(cl,COST.dev) && game.dev.deck.length){
        payCost(cl,COST.dev);
        const t=game.dev.deck.shift();
        cl.devCards.push({type:t, boughtTurn:game.turn});
        if(t==="vp") cl.vpCards++;
        cl.devCount=cl.devCards.length;
        game.rng.log.push({kind:"devdraw"});
        logLine("Claude buys a development card.","claude");
        checkWinFor(cl);
      } else logLine("Claude wanted to buy a dev card — couldn't.","claude");
      break;
    case "bankTrade": {
      const give=cleanMap(a.give), get=cleanMap(a.get), rates=portRatesFor(cl.id);
      let cost=0, ok=true;
      for(const r of RES){ if(give[r]%rates[r]!==0) ok=false; cost+=give[r]/rates[r]; }
      if(ok && cost>0 && cost===sum(get) && RES.every(r=>cl.hand[r]>=give[r])){
        for(const r of RES){ cl.hand[r]-=give[r]; cl.hand[r]+=get[r]; }
        cl.cardCount=sum(cl.hand);
        logLine(`Claude trades ${RES.filter(r=>give[r]).map(r=>give[r]+" "+RES_META[r].label).join(", ")} → ${RES.filter(r=>get[r]).map(r=>get[r]+" "+RES_META[r].label).join(", ")} with the bank.`,"claude");
      } else logLine("Claude proposed an invalid bank trade — skipped.","claude");
      break;
    }
    case "yearOfPlenty": {
      if(cl.playedDevThisTurn){ logLine("Claude already played a dev card — YoP skipped.","claude"); break; }
      const di=(cl.devCards||[]).findIndex(d=>d.type==="plenty"&&d.boughtTurn<game.turn);
      if(di<0){ logLine("Claude has no Year of Plenty — skipped.","claude"); break; }
      const take=(Array.isArray(a.take)?a.take:[]).filter(r=>RES.includes(r)).slice(0,2);
      while(take.length<2) take.push("wheat");
      for(const r of take){ cl.hand[r]++; }
      cl.cardCount=sum(cl.hand);
      cl.devCards.splice(di,1); cl.devCount=cl.devCards.length; cl.playedDevThisTurn=true;
      logLine(`Claude plays Year of Plenty (+${take.map(r=>RES_META[r].label).join(", +")}).`,"claude");
      break;
    }
    case "monopoly": {
      if(cl.playedDevThisTurn){ logLine("Claude already played a dev card — Monopoly skipped.","claude"); break; }
      if(!(cl.devCards||[]).some(d=>d.type==="mono"&&d.boughtTurn<game.turn) || !RES.includes(a.resource)){
        logLine("Claude couldn't play Monopoly — skipped.","claude"); break;
      }
      logLine(`Claude plays Monopoly on ${RES_META[a.resource].label} — enter what each player hands over.`,"claude");
      if(startMonopoly(cl.id, a.resource)) return "PAUSE";
      break;
    }
    case "roadBuilding": {
      if(cl.playedDevThisTurn){ logLine("Claude already played a dev card — Road Building skipped.","claude"); break; }
      const di=(cl.devCards||[]).findIndex(d=>d.type==="road"&&d.boughtTurn<game.turn);
      if(di<0){ logLine("Claude has no Road Building — skipped.","claude"); break; }
      cl.devCards.splice(di,1); cl.devCount=cl.devCards.length; cl.playedDevThisTurn=true;
      logLine("Claude plays Road Building.","claude");
      const want=(Array.isArray(a.roads)?a.roads:[]).slice(0,2);
      for(const ek of want){ if(legalRoadEdges(cl.id).includes(ek) && cl.roads.length<15){ cl.roads.push(ek); logLine("Claude builds a free road.","claude"); } }
      recomputeAll(); checkWinFor(cl);
      break;
    }
    default: logLine("Claude sent an unknown action ("+a.type+") — ignored.","claude");
  }
}

/* ---- human → Claude trade ---- */
async function sendTradeToClaude(){
  const c=cur();
  const give=cleanMap(draft("tc-give")), get=cleanMap(draft("tc-get"));
  if(sum(give)===0 && sum(get)===0){ flash("Set some cards to trade."); return; }
  if(sum(give)>c.cardCount){ flash("You don't have that many cards."); return; }
  const cl=game.players.find(p=>p.isClaude);
  ui.busy=true; render();
  try{
    const offer={give, get, fromName:c.name};
    const res=await askJSON(tradeReplyPrompt(offer),"default");
    ui.busy=false;
    const holds = RES.every(r=>cl.hand[r]>=get[r]);
    if(res.decision==="accept" && holds){
      ui.tradeResult={ headline:`Claude accepts. You give ${fmtMap(give)}, receive ${fmtMap(get)}.`, reason:res.reason, apply:()=>{
        for(const r of RES){ cl.hand[r]+=give[r]; cl.hand[r]-=get[r]; }
        cl.cardCount=sum(cl.hand);
        c.cardCount += sum(get) - sum(give);
        logLine(`${c.name} ↔ Claude: ${c.name} gives ${fmtMap(give)}, gets ${fmtMap(get)}.`,"claude");
      }};
    } else if(res.decision==="counter" && res.counter){
      const cg=cleanMap(res.counter.give), cget=cleanMap(res.counter.get); // from THEM(=human) give / from YOU(=claude) get... per prompt: counter.give = from them, counter.get = from you(claude)
      const holds2 = RES.every(r=>cl.hand[r]>=cget[r]);
      ui.tradeResult={ headline:`Claude counters: you give ${fmtMap(cg)}, receive ${fmtMap(cget)}.`, reason:res.reason,
        apply: holds2 && sum(cg)<=c.cardCount ? ()=>{
          for(const r of RES){ cl.hand[r]+=cg[r]; cl.hand[r]-=cget[r]; }
          cl.cardCount=sum(cl.hand);
          c.cardCount += sum(cget) - sum(cg);
          logLine(`${c.name} ↔ Claude (counter): ${c.name} gives ${fmtMap(cg)}, gets ${fmtMap(cget)}.`,"claude");
        } : null };
      if(!ui.tradeResult.apply) ui.tradeResult.headline += " (can't be completed with current cards)";
    } else {
      ui.tradeResult={ headline: res.decision==="accept" ? "Claude accepted but doesn't hold those cards." : "Claude declines.", reason:res.reason, apply:null };
    }
  }catch(err){
    ui.busy=false;
    ui.tradeResult={ headline:"Couldn't reach Claude ("+(err.code||err.message||err)+").", reason:"", apply:null };
  }
  commit();
}
function fmtMap(m){ return RES.filter(r=>m[r]).map(r=>m[r]+" "+RES_META[r].label).join(", ")||"nothing"; }

/* ---- autopilot hooks ---- */
function robberAutopilot(){
  if(!game || game.phase!=="play" || ui.busy) return;
  const pd=game.pending;
  if(pd && pd.type==="robber" && pd.step==="move" && cur().isClaude && !ui._robberRunning && sampleFn!==null && pd.discards.every(d=>d.done)){
    ui._robberRunning=true; ui.busy=true;
    Promise.resolve().then(()=>claudeRobberDecision()).finally(()=>{ ui._robberRunning=false; });
  }
}
function resumeAutopilot(){
  if(!game) return;
  if(game.phase==="setup"){
    if(game.setup.pickStarter) return;
    const pid=game.setup.order[game.setup.step];
    if(playerById(pid) && playerById(pid).isClaude && sampleFn!==null && !ui.busy) setTimeout(claudeSetupPlace,300);
    else if(!ui.pick) setupAutoPick();
  } else if(game.phase==="play" && !game.pickPlayFirst && cur().isClaude && !ui.busy && !game.pending && game.pendingRoll==null && !game.isExample && sampleFn!==null){
    setTimeout(runClaudeTurn,300);
  }
}

const THEME_KEY="catan-third-hand:theme";
function applyTheme(t){
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
}
function initTheme(){
  let t=""; try{ t=localStorage.getItem(THEME_KEY)||""; }catch(e){}
  applyTheme(t);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const mqDark=window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches;
  let next;
  if(!cur) next = mqDark ? "light" : "dark";
  else if(cur==="dark") next="light";
  else next="dark";
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY,next); }catch(e){}
}
async function doExport(){
  const c=clone(game); if(c.board) c.board.geom=null;
  const json=JSON.stringify(c,null,2);
  const name="catan-third-hand-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".json";
  if(downloadsFn===undefined){ try{ downloadsFn = window.claude&&claude.use ? await claude.use("downloads") : null; }catch(e){ downloadsFn=null; } }
  if(downloadsFn){
    try{ await downloadsFn.save({filename:name, data:json}); logLine("Game exported."); }
    catch(e){ if(e.code!=="declined") logLine("Export failed ("+e.code+")."); }
  }else{
    try{ await navigator.clipboard.writeText(json); logLine("No download available here — game JSON copied to clipboard."); }
    catch(e){ logLine("Couldn't export in this view."); }
  }
  render();
}
function doImport(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const c=JSON.parse(fr.result);
      if(!c || !c.board) throw new Error("not a save file");
      game=c; ui={}; undoStack=[]; buildGeometry(); resolvePorts();
      logLine("Game imported.","big");
      commit(); resumeAutopilot();
    }catch(e){
      ui.importErr="That file isn't a valid Catan Third Hand save.";
      render();
    }
  };
  fr.readAsText(file);
}

let _inited=false;
async function init(){

    getSample().then(()=>{ render(); resumeAutopilot(); }).catch(()=>{});
  }catch(err){
    const a=$("#app");
    if(a) a.innerHTML='<pre style="white-space:pre-wrap;color:#b23b2e;background:#fff;padding:16px;border-radius:8px;font:12px/1.5 ui-monospace,monospace">Startup error:\n'+String(err&&err.message||err)+'\n\n'+String(err&&err.stack||'')+'</pre>';
  }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
