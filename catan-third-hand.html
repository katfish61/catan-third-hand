<title>Catan Third Hand</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap");
  :root{

      --bg:#141f1d; --panel:#1b2725; --panel-2:#202e2b; --ink:#ecefe9; --muted:#9aaaa4;
      --line:#2c3d39; --line-strong:#3a4d48;
      --accent:#4fbcae; --accent-ink:#0c1a18; --accent-soft:#1e3b37;

      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141f1d; --panel:#1b2725; --panel-2:#202e2b; --ink:#ecefe9; --muted:#9aaaa4;
    --line:#2c3d39; --line-strong:#3a4d48;
    --accent:#4fbcae; --accent-ink:#0c1a18; --accent-soft:#1e3b37;
    --good:#6bbf5f; --warn:#e0a63a; --crit:#e0685a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.5;
  }
  h1,h2,h3{margin:0; text-wrap:balance}
  button{font-family:inherit; font-size:inherit; color:inherit}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}

  .wrap{max-width:1240px; margin:0 auto; padding:20px 20px 64px}
  header.app{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;

  }
  .brand{display:flex; align-items:baseline; gap:12px}
  .brand h1{
    font-family:"IM Fell English",Georgia,"Times New Roman",serif;
    font-weight:400; font-size:30px; letter-spacing:.2px; line-height:1;
  }
  .brand .tag{color:var(--muted); font-size:12.5px; letter-spacing:.03em}
  .head-actions{display:flex; gap:8px; flex-wrap:wrap}

  .btn{
    appearance:none; border:1px solid var(--line-strong); background:var(--panel);
    padding:7px 12px; border-radius:8px; cursor:pointer; font-weight:500;
    transition:background .12s,border-color .12s,transform .04s;
  }
  .btn:hover{background:var(--panel-2)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .layout{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr); gap:20px; align-items:start}

  @media (max-width:940px){ .board-col{position:static} }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .card + .card{margin-top:14px}
  .card .hd{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 14px; border-bottom:1px solid var(--line);
  }
  .card .hd h2{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}

  .legend{display:flex; flex-wrap:wrap; gap:6px 14px; padding:10px 4px 2px; font-size:11.5px; color:var(--muted)}
  .legend .sw{display:inline-flex; align-items:center; gap:5px}
  .legend .dot{width:10px; height:10px; border-radius:3px; border:1px solid rgba(0,0,0,.15)}

  .pill{
    display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
    font-size:12px; font-weight:600; border:1px solid var(--line-strong); background:var(--panel-2);
  }

  table.score{width:100%; border-collapse:collapse; font-size:13px}
  table.score th,table.score td{padding:7px 8px; text-align:left; border-bottom:1px solid var(--line)}
  table.score th{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
  table.score tr:last-child td{border-bottom:0}
  table.score td.num{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
  .who{display:inline-flex; align-items:center; gap:7px; font-weight:600}
  .chip-color{width:11px; height:11px; border-radius:3px; border:1px solid rgba(0,0,0,.2); flex:none}
  .badge{font-size:10px; font-weight:700; padding:1px 5px; border-radius:5px; letter-spacing:.04em}
  .badge.lr{background:var(--accent-soft); color:var(--accent)}
  .badge.la{background:color-mix(in srgb,var(--warn) 22%,var(--panel)); color:var(--warn)}

    border:1px dashed var(--line-strong); border-radius:9px; padding:12px;
    background:repeating-linear-gradient(135deg,transparent,transparent 8px,color-mix(in srgb,var(--muted) 6%,transparent) 8px,color-mix(in srgb,var(--muted) 6%,transparent) 16px);

  .board-hexnum{font-family:"IBM Plex Mono",monospace; font-size:9px; fill:rgba(0,0,0,.32)}

  @media (prefers-reduced-motion:no-preference){

  details.help{margin-bottom:14px; border:1px solid var(--line); border-radius:9px; background:var(--panel)}

<div class="wrap">
  <header class="app">
    <div class="brand">
      <h1>Catan&nbsp;Third&nbsp;Hand</h1>
      <span class="tag">a companion board · Claude plays the third seat</span>
    </div>
    <div class="head-actions">
      <button class="btn sm ghost" id="btn-theme" title="Toggle theme">Theme</button>
      <button class="btn sm" id="btn-undo" disabled>↶ Undo</button>
      <button class="btn sm" id="btn-export">Export save</button>
      <button class="btn sm" id="btn-import">Import</button>
      <button class="btn sm danger" id="btn-new">New game</button>
      <input type="file" id="file-import" accept="application/json,.json" class="sr">
    </div>
  </header>

  <div id="app"><p style="padding:24px;color:#888">Loading Catan Third Hand…</p></div>
</div>

<script>
"use strict";
window.addEventListener("error", ev=>{
  try{
    const a=document.getElementById("app");
    if(a && a.dataset.ok!=="1"){
      a.innerHTML='<pre style="white-space:pre-wrap;color:#b23b2e;background:#fff;padding:16px;border-radius:8px;font:12px/1.5 ui-monospace,monospace">Startup error:\n'+
        String(ev.message||(ev.error&&ev.error.message)||ev.error)+'\n\n'+String((ev.error&&ev.error.stack)||'')+'</pre>';
    }
  }catch(e){}
});
/* ============================================================ CONSTANTS */
const RES = ["wood","brick","sheep","wheat","ore"];
const RES_META = {
  wood:{label:"Wood",  color:"var(--wood)",  hex:"forest"},
  brick:{label:"Brick",color:"var(--brick)", hex:"hills"},
  sheep:{label:"Sheep",color:"var(--sheep)", hex:"pasture"},
  wheat:{label:"Wheat",color:"var(--wheat)", hex:"fields"},
  ore:{label:"Ore",    color:"var(--ore)",   hex:"mountains"},
};
const COST = {
  road:{wood:1,brick:1},
  settlement:{wood:1,brick:1,sheep:1,wheat:1},
  city:{wheat:2,ore:3},
  dev:{sheep:1,wheat:1,ore:1},
};
const DEV_COMPOSITION = [["knight",14],["road",2],["plenty",2],["mono",2],["vp",5]];
const DEV_LABEL = {knight:"Knight",road:"Road Building",plenty:"Year of Plenty",mono:"Monopoly",vp:"Victory Point"};
const PLAYER_COLORS = ["#c1352b","#2f6db0","#d98324"];

/* Standard-ish base board, row-major ids 1..19, rows 3/4/5/4/3.
   Resource counts: 4 wood, 3 brick, 4 sheep, 4 wheat, 3 ore, 1 desert.
   Token multiset: 2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12 */
const STANDARD_BOARD = [
  {r:"ore",t:10},{r:"sheep",t:2},{r:"wood",t:9},
  {r:"wheat",t:12},{r:"brick",t:6},{r:"sheep",t:4},{r:"brick",t:10},
  {r:"wheat",t:9},{r:"wood",t:11},{r:"desert",t:0},{r:"wood",t:3},{r:"ore",t:8},
  {r:"wood",t:8},{r:"ore",t:3},{r:"wheat",t:4},{r:"sheep",t:5},
  {r:"brick",t:5},{r:"wheat",t:6},{r:"sheep",t:11},
];
const PORT_TYPES = ["3:1","wheat","3:1","ore","3:1","wood","brick","3:1","sheep"];

/* Standard A–R number-token spiral (letters on the token backs).
   Outer ring of 12 hexes, then inner ring of 6, then the centre. */
const RING_OUTER = [1,2,3,7,12,16,19,18,17,13,8,4];
const RING_INNER = [5,6,11,15,14,9];
const AR_NUMBERS = [5,2,6,3,8,10,9,12,11,4,8,10,9,4,5,6,3,11]; // A..R
function spiralOrder(startId, dir){
  let outer=RING_OUTER.slice(), inner=RING_INNER.slice();
  if(dir==="ccw"){ outer=[outer[0]].concat(outer.slice(1).reverse()); inner=[inner[0]].concat(inner.slice(1).reverse()); }
  let si=outer.indexOf(startId); if(si<0) si=0;
  outer=outer.slice(si).concat(outer.slice(0,si));
  return outer.concat(inner,[10]);
}

const STRATEGY_PRIMER = `You are playing 3-player BASE Catan (no expansions) to 10 victory points. Play to win; do not kingmake.
- Opening: maximize total pip count and resource diversity across your two settlements. Prioritize 6/8 tiles and covering wood+brick+wheat+sheep (expansion) or ore+wheat (city/dev engine). Take a 2:1 port only if you already produce that resource well.
- Value ore+wheat: cities double output and fuel dev cards.
- Buy dev cards when resource-rich and short of good build spots. Knights reposition the robber and chase Largest Army.
- Robber: place on the highest-pip tile of whoever is closest to winning or is starving you; rob the leader or the largest hand. Don't pick a fight you can't afford.
- Trades: never give a resource that lets someone hit 8+ VP or complete Largest Army / Longest Road. Trade true surplus for what unblocks your next build. Prefer bank/port trades over feeding an opponent when anyone is close to winning.
- Keep your hand at 7 or fewer once 7s are live, unless you can spend down this turn.
- Take Longest Road or Largest Army when it's cheap and moves you ahead, or to deny a winning opponent.
- Count opponents' visible VP plus likely hidden VP dev cards before assuming you have time.
- Prefer concrete progress (a settlement, a city, LR/LA) over hoarding cards.`;

/* ---------------- tiny helpers ---------------- */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const el = (tag,attrs={},kids=[])=>{
  const n=document.createElement(tag);
  for(const k in attrs){
    if(k==="class")n.className=attrs[k];
    else if(k==="html")n.innerHTML=attrs[k];
    else if(k==="text")n.textContent=attrs[k];
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),attrs[k]);
    else n.setAttribute(k,attrs[k]);
  }
  for(const c of [].concat(kids)) if(c!=null) n.append(c.nodeType?c:document.createTextNode(c));
  return n;
};
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sum = o => RES.reduce((a,k)=>a+(o?.[k]||0),0);
const nowClock = ()=>{const d=new Date();return d.toTimeString().slice(0,5);};
const pips = t => t? 6-Math.abs(7-t) : 0;

/* mulberry32 PRNG driven by game.rng.state (uint32) */
function rnd(){
  game.rng.state = (game.rng.state + 0x6D2B79F5) >>> 0;
  let t = game.rng.state;
  t = Math.imul(t ^ (t>>>15), t | 1);
  t ^= t + Math.imul(t ^ (t>>>7), t | 61);
  return ((t ^ (t>>>14)) >>> 0) / 4294967296;
}
const rint = n => Math.floor(rnd()*n);
function drawRandomKey(obj){ /* weighted pick of a resource key from a hand map */
  const total = sum(obj); if(total<=0) return null;
  let x = rint(total);
  for(const k of RES){ x -= (obj[k]||0); if(x<0) return k; }
  return RES.find(k=>obj[k]>0) || null;
}
async function sha256Hex(str){
  try{
    const c = self.crypto || window.crypto;
    const buf = await c.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return "(hash unavailable in this browser)"; }
}
function randSeedHex(){
  try{
    const a = new Uint32Array(1); (self.crypto||window.crypto).getRandomValues(a);
    return a[0].toString(16).padStart(8,"0");
  }catch(e){
    return Math.floor(Math.random()*0xffffffff).toString(16).padStart(8,"0");
  }
}

/* ============================================================ BOARD GEOMETRY
   Deterministic from layout constants. Vertex / edge keys are rounded pixel
   coords so they survive save/load as long as these constants never change. */
const LAY = {rows:[3,4,5,4,3], S:46, M:60};
LAY.HSP = Math.sqrt(3)*LAY.S;
LAY.VSP = 1.5*LAY.S;
LAY.MAXW = 5*LAY.HSP;

function hexCenter(id){ // id 1..19
  let i=id-1, r=0;
  for(const c of LAY.rows){ if(i<c) break; i-=c; r++; }
  const c = LAY.rows[r];
  const cx = LAY.M + LAY.MAXW/2 - (c-1)*LAY.HSP/2 + i*LAY.HSP;
  const cy = LAY.M + LAY.S + r*LAY.VSP;
  return {cx,cy};
}
function hexCorners(id){
  const {cx,cy}=hexCenter(id); const out=[];
  for(let k=0;k<6;k++){
    const a=(Math.PI/180)*(-90+60*k);
    out.push([cx+LAY.S*Math.cos(a), cy+LAY.S*Math.sin(a)]);
  }
  return out;
}
const vkey = (x,y)=> Math.round(x)+","+Math.round(y);

/* Build verts / edges / adjacency + resolve ports. Attaches to game.board. */
function buildGeometry(){ game.board.geom=computeGeom(); resolvePorts(); }
function computeGeom(){
  const verts={}, edges={};
  for(let id=1; id<=19; id++){
    const cs = hexCorners(id);
    const ks = cs.map(([x,y])=>{
      const k=vkey(x,y);
      (verts[k] ||= {x:+k.split(",")[0], y:+k.split(",")[1], hexes:[], adjEdges:[], adj:[]});
      if(!verts[k].hexes.includes(id)) verts[k].hexes.push(id);
      return k;
    });
    for(let k=0;k<6;k++){
      const a=ks[k], b=ks[(k+1)%6];
      const ek=[a,b].sort().join("|");
      (edges[ek] ||= {v:[a,b].sort(), hexes:[], mx:0,my:0});
      if(!edges[ek].hexes.includes(id)) edges[ek].hexes.push(id);
    }
  }
  for(const ek in edges){
    const e=edges[ek];
    e.mx=(verts[e.v[0]].x+verts[e.v[1]].x)/2;
    e.my=(verts[e.v[0]].y+verts[e.v[1]].y)/2;
    for(const v of e.v){
      verts[v].adjEdges.push(ek);
      verts[v].adj.push(e.v[0]===v? e.v[1]:e.v[0]);
    }
  }
  // ordered perimeter cycle of border edges (exactly one adjacent hex)
  const border = Object.keys(edges).filter(k=>edges[k].hexes.length===1);
  const bset = new Set(border);
  const perim=[]; let cur=border[0]; let prevV=null;
  if(cur){
    const startV = edges[cur].v[0];
    let endV = edges[cur].v[1];
    perim.push(cur); prevV=startV;
    for(let guard=0; guard<border.length+4; guard++){
      const nxt = verts[endV].adjEdges.find(k=>bset.has(k) && k!==cur);
      if(!nxt || nxt===border[0]) break;
      perim.push(nxt);
      const e=edges[nxt]; const other = e.v[0]===endV? e.v[1]:e.v[0];
      prevV=endV; endV=other; cur=nxt;
    }
  }
  // bounds for viewBox
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const k in verts){ const v=verts[k]; minX=Math.min(minX,v.x); minY=Math.min(minY,v.y); maxX=Math.max(maxX,v.x); maxY=Math.max(maxY,v.y); }
  const pad=48;
  return {
    verts, edges, perim,
    view:{x:minX-pad, y:minY-pad, w:(maxX-minX)+pad*2, h:(maxY-minY)+pad*2, cx:(minX+maxX)/2, cy:(minY+maxY)/2},
  };
}
function resolvePorts(){
  const g=game.board.geom;
  for(const p of game.board.ports){
    const e = g.edges[p.edge];
    p.verts = e? e.v.slice() : [];
  }
}
/* Harbour positions read off the physical frame: [hex id, side of that hex, type]. Hex ids run row by row from the top-left. */
const STD_PORTS = [["1","NW","3:1"],["2","NE","sheep"],["7","NE","3:1"],["12","E","3:1"],["16","SE","brick"],
                   ["18","SE","wood"],["17","SW","3:1"],["13","W","wheat"],["4","W","ore"]];
function standardPorts(g=game.board.geom){
  const SIDE={NE:0,E:1,SE:2,SW:3,W:4,NW:5};
  return STD_PORTS.map(([id,side,type])=>{
    const cs=hexCorners(+id), k=SIDE[side];
    const a=vkey(...cs[k]), b=vkey(...cs[(k+1)%6]);
    return {edge:[a,b].sort().join("|"), type};
  }).filter(p=>g.edges[p.edge]);
}
/* description of a vertex / edge in table language */
function vDesc(k){
  const hs = (game.board.geom.verts[k]?.hexes||[]).map(id=>{
    const h=game.board.hexes[id-1];
    return h.resource==="desert" ? "desert" : `${RES_META[h.resource].label}-${h.token}`;
  });
  return hs.join(" · ") || k;
}
function eDesc(k){
  const e=game.board.geom.edges[k]; if(!e) return k;
  return e.v.map(vDesc).join("  ↔  ");
}

function freshDevDeck(){
  const d=[];
  for(const [t,n] of DEV_COMPOSITION) for(let i=0;i<n;i++) d.push(t);

  for(let i=d.length-1;i>0;i--){ const j=rint(i+1); [d[i],d[j]]=[d[j],d[i]]; }

}

/* ---- undo: snapshot before each human action; never rewinds past Claude's random events ---- */
let undoStack = [];
function gameJSON(){ const g=game.board.geom; game.board.geom=null; const j=JSON.stringify(game); game.board.geom=g; return j; }
function snapshot(label){
  if(!game || game.phase==="config" || ui.busy) return;
  const j=gameJSON(), top=undoStack[undoStack.length-1];
  if(top && top.json===j) return;
  undoStack.push({json:j, label, rng:game.rng.state});
  if(undoStack.length>60) undoStack.shift();
}
function undoLast(){
  if(!game || game.phase==="config" || ui.busy) return;
  const now=gameJSON();
  while(undoStack.length){
    const top=undoStack[undoStack.length-1];
    if(top.json===now){ undoStack.pop(); continue; }        // no-op snapshot from a view-only click
    if(top.rng!==game.rng.state){
      flash("Can't undo past a random event (a Claude roll, steal, discard, or random pick) — that would let the dice be re-rolled.");
      return;
    }
    undoStack.pop();
    game=JSON.parse(top.json); buildGeometry(); resolvePorts();
    ui={};
    logLine("Undid: "+top.label,"big");
    commit(); resumeAutopilot();
    return;
  }
}
function updateUndoButton(){
  const b=$("#btn-undo"); if(!b) return;
  let top=null;
  if(game && game.phase!=="config" && !ui.busy){
    const now=gameJSON();
    for(let i=undoStack.length-1;i>=0;i--){ if(undoStack[i].json!==now){ top=undoStack[i]; break; } }
  }
  b.disabled=!top;
  b.title=top? "Undo: "+top.label : "Nothing to undo";
}

/* ============================================================ RULES */
const P = () => game.players;
const cur = () => game.players[game.currentIdx];
function playerById(id){ return game.players.find(p=>p.id===id); }
function allBuildings(){ // vertexKey -> {pid,kind}
  const m={};
  for(const p of game.players){
    for(const v of p.settlements) m[v]={pid:p.id,kind:"settlement"};
    for(const v of p.cities) m[v]={pid:p.id,kind:"city"};
  }
  return m;
}
function occupiedVertex(k){ const b=allBuildings(); return !!b[k]; }
function vertexOwner(k){ return allBuildings()[k]||null; }
function occupiedEdge(k){ for(const p of game.players) if(p.roads.includes(k)) return p.id; return null; }
function edgeOwner(k){ return occupiedEdge(k); }

function legalSettlementVertices(pid,{setup=false}={}){
  const g=game.board.geom, b=allBuildings(), out=[];
  for(const k in g.verts){
    if(b[k]) continue;
    if(g.verts[k].adj.some(n=>b[n])) continue;      // distance rule
    if(!setup){
      const touches = g.verts[k].adjEdges.some(ek=>game.players.find(p=>p.id===pid).roads.includes(ek));
      if(!touches) continue;
    }
    out.push(k);
  }
  return out;
}
function legalRoadEdges(pid,{setup=false,fromVertex=null}={}){
  const g=game.board.geom, b=allBuildings(), me=playerById(pid), out=[];
  for(const ek in g.edges){
    if(occupiedEdge(ek)) continue;
    if(setup){
      if(fromVertex && g.edges[ek].v.includes(fromVertex)) out.push(ek);
      continue;
    }
    let ok=false;
    for(const v of g.edges[ek].v){
      const own=b[v];
      if(own && own.pid===pid){ ok=true; break; }
      if(own && own.pid!==pid) continue;             // can't extend past an opponent building
      if(g.verts[v].adjEdges.some(x=>x!==ek && me.roads.includes(x))){ ok=true; break; }
    }
    if(ok) out.push(ek);
  }
  return out;
}
function legalCityVertices(pid){ return playerById(pid).settlements.slice(); }

function canAfford(p,cost){ return RES.every(r=>(p.isClaude? p.hand[r] : p.cardCount>=0) && (!p.isClaude || p.hand[r]>=(cost[r]||0))); }
function canAffordCount(p,cost){ // humans: only the count is known; Claude: exact hand must cover every resource
  if(p.isClaude) return RES.every(r=>(p.hand[r]||0)>=(cost[r]||0));
  return sum(cost) <= p.cardCount;
}
function payCost(p,cost,label){
  if(p.isClaude){ for(const r of RES) p.hand[r]-=(cost[r]||0); }
  p.cardCount -= sum(cost);
}
function gainRes(p,map){
  if(p.isClaude){ for(const r of RES) p.hand[r]+=(map[r]||0); }
  p.cardCount += sum(map);
}
function costStr(cost){ return RES.filter(r=>cost[r]).map(r=>`${cost[r]}×${RES_META[r].label}`).join(" + "); }

/* production for a dice roll — returns {pid:{res:qty}} and applies it */
function applyProduction(roll){
  const gain={};
  game.players.forEach(p=>gain[p.id]={});
  const b=allBuildings();
  game.board.hexes.forEach(h=>{
    if(h.token!==roll) return;
    if(h.id===game.board.robberHex) return;
    if(h.resource==="desert") return;
    for(const k in game.board.geom.verts){
      if(!game.board.geom.verts[k].hexes.includes(h.id)) continue;
      const own=b[k]; if(!own) continue;
      const n = own.kind==="city"?2:1;
      gain[own.pid][h.resource]=(gain[own.pid][h.resource]||0)+n;
    }
  });
  game.players.forEach(p=>{ if(sum(gain[p.id])) gainRes(p,gain[p.id]); });
  return gain;
}
function gainSummary(gain){
  return game.players.map(p=>{
    const parts=RES.filter(r=>gain[p.id][r]).map(r=>`${gain[p.id][r]} ${RES_META[r].label.toLowerCase()}`);
    return parts.length? `${p.name} +${parts.join(", +")}` : null;
  }).filter(Boolean).join(" · ") || "no production";
}

/* ---- longest road (DFS over a player's road edges, blocked at opponent buildings) ---- */
function longestRoad(pid){
  const g=game.board.geom, me=playerById(pid);
  const roadSet=new Set(me.roads);
  const b=allBuildings();
  const blocked=new Set();
  for(const k in b) if(b[k].pid!==pid) blocked.add(k);
  let best=0;
  function dfs(edge, fromV, visited){
    if(visited.size>best) best=visited.size;
    const ends=g.edges[edge].v;
    for(const v of ends){
      if(v===fromV) continue;
      if(blocked.has(v)) continue;
      for(const nb of g.verts[v].adjEdges){
        if(nb===edge || !roadSet.has(nb) || visited.has(nb)) continue;
        visited.add(nb); dfs(nb, v, visited); visited.delete(nb);
      }
    }
  }
  for(const e of roadSet){ const vis=new Set([e]); dfs(e,null,vis); }
  return best;
}
function updateLongestRoad(){
  const lens={}; game.players.forEach(p=>lens[p.id]=longestRoad(p.id));
  const elig = game.players.filter(p=>lens[p.id]>=5);
  const prev = game.lr.holder;
  let holder=null;
  if(elig.length){
    const max=Math.max(...elig.map(p=>lens[p.id]));
    const top=elig.filter(p=>lens[p.id]===max);
    if(prev && top.some(p=>p.id===prev)) holder=prev;
    else if(top.length===1) holder=top[0].id;
    else holder = prev && lens[prev]>=5 ? prev : null;
  }
  game.lr={holder, len:holder?lens[holder]:0, lens};
  if(holder!==prev){
    if(holder) logLine(`Longest Road → ${playerById(holder).name} (${lens[holder]}).`);
    else if(prev) logLine(`Longest Road is now unclaimed.`);
  }
}
function updateLargestArmy(){
  const prev=game.la.holder;
  const elig=game.players.filter(p=>p.knightsPlayed>=3);
  let holder=prev;
  if(!elig.length) holder=null;
  else{
    const max=Math.max(...elig.map(p=>p.knightsPlayed));
    const top=elig.filter(p=>p.knightsPlayed===max);
    if(prev && top.some(p=>p.id===prev)) holder=prev;
    else if(top.length===1) holder=top[0].id;
  }
  game.la={holder, n:holder?playerById(holder).knightsPlayed:0};
  if(holder!==prev && holder) logLine(`Largest Army → ${playerById(holder).name} (${game.la.n} knights).`);
}
function publicVP(p){
  return p.settlements.length + p.cities.length*2
    + (game.lr.holder===p.id?2:0) + (game.la.holder===p.id?2:0)
    + (p.isClaude?0:p.vpCards); // humans' declared VP cards shown; Claude's stay hidden in the UI
}
function trueVP(p){
  return p.settlements.length + p.cities.length*2
    + (game.lr.holder===p.id?2:0) + (game.la.holder===p.id?2:0) + p.vpCards;
}
function portRatesFor(pid){
  const me=playerById(pid);
  const owned=new Set([...me.settlements,...me.cities]);
  const rates={}; RES.forEach(r=>rates[r]=4);
  for(const p of game.board.ports){
    if(!p.verts.some(v=>owned.has(v))) continue;
    if(p.type==="3:1"){ RES.forEach(r=>rates[r]=Math.min(rates[r],3)); }
    else rates[p.type]=Math.min(rates[p.type],2);
  }
  return rates;
}
function checkWinFor(p){
  if(trueVP(p)>=10){
    game.winner=p.id; game.phase="over";
    if(p.isClaude && p.vpCards>0) logLine(`Claude reveals ${p.vpCards} Victory Point card(s).`,"claude");
    logLine(`${p.name} wins with ${trueVP(p)} victory points! 🏆`,"big");
    return true;
  }
  return false;
}

/* ---------------- BOARD SVG ---------------- */
function renderBoard(){
  const g=game.board.geom, v=g.view;
  const HEXFILL={forest:"#3f6b3a",hills:"#b3623f",pasture:"#8fae5d",fields:"#d8a53a",mountains:"#7d8a99",desert:"#d9c9a3"};
  let s=`<svg class="board" viewBox="${v.x} ${v.y} ${v.w} ${v.h}" role="img" aria-label="Catan board">`;
  s+=`<rect x="${v.x}" y="${v.y}" width="${v.w}" height="${v.h}" rx="14" fill="var(--sea)"></rect>`;
  // hexes
  for(let id=1;id<=19;id++){
    const h=game.board.hexes[id-1];
    const pts=hexCorners(id).map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ");
    const {cx,cy}=hexCenter(id);
    s+=`<polygon points="${pts}" fill="${HEXFILL[RES_META[h.resource]?.hex]||HEXFILL.desert}" stroke="rgba(0,0,0,.25)" stroke-width="1.5"></polygon>`;
    s+=`<text class="board-hexnum" x="${(cx).toFixed(1)}" y="${(cy-LAY.S+11).toFixed(1)}" text-anchor="middle">${id}</text>`;
    if(h.token){
      const red = h.token===6||h.token===8;
      s+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="15" fill="var(--token)" stroke="rgba(0,0,0,.2)"></circle>`;
      s+=`<text class="tok-num" x="${cx.toFixed(1)}" y="${(cy+1).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="${red?"var(--red-num)":"var(--token-ink)"}">${h.token}</text>`;
      const np=pips(h.token), pw=(np-1)*3;
      for(let i=0;i<np;i++) s+=`<circle cx="${(cx-pw/2+i*3).toFixed(1)}" cy="${(cy+9).toFixed(1)}" r="1.1" fill="${red?"var(--red-num)":"var(--token-ink)"}"></circle>`;
    }
    if(id===game.board.robberHex){
      s+=`<circle cx="${(cx+13).toFixed(1)}" cy="${(cy-13).toFixed(1)}" r="9" fill="var(--robber)" stroke="#fff" stroke-width="1.5"></circle>`;
    }
  }
  // ports
  for(const p of game.board.ports){
    const e=g.edges[p.edge]; if(!e) continue;
    const dx=e.mx-v.cx, dy=e.my-v.cy, L=Math.hypot(dx,dy)||1;
    const ox=e.mx+dx/L*22, oy=e.my+dy/L*22;
    for(const vk of e.v){ const vv=g.verts[vk]; s+=`<line x1="${vv.x}" y1="${vv.y}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="rgba(255,255,255,.7)" stroke-width="2"></line>`; }
    s+=`<circle cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"></circle>`;
    s+=`<text x="${ox.toFixed(1)}" y="${(oy+3).toFixed(1)}" text-anchor="middle" font-size="8" font-family="IBM Plex Mono, monospace" fill="var(--ink)">${p.type==="3:1"?"3:1":p.type.slice(0,2)}</text>`;
  }
  // roads
  for(const pl of game.players) for(const ek of pl.roads){
    const e=g.edges[ek]; if(!e) continue;
    const a=g.verts[e.v[0]], b=g.verts[e.v[1]];
    const ax=a.x+(b.x-a.x)*0.14, ay=a.y+(b.y-a.y)*0.14, bx=b.x+(a.x-b.x)*0.14, by=b.y+(a.y-b.y)*0.14;
    s+=`<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="${pl.color}" stroke-width="7" stroke-linecap="round"></line>`;
  }
  // buildings
  const b=allBuildings();
  for(const k in b){
    const vv=g.verts[k]; const pl=playerById(b[k].pid);
    if(b[k].kind==="city")
      s+=`<rect x="${(vv.x-8).toFixed(1)}" y="${(vv.y-8).toFixed(1)}" width="16" height="16" rx="3" fill="${pl.color}" stroke="#fff" stroke-width="1.5"></rect><circle cx="${vv.x}" cy="${vv.y}" r="2.5" fill="#fff"></circle>`;
    else
      s+=`<circle cx="${vv.x}" cy="${vv.y}" r="6.5" fill="${pl.color}" stroke="#fff" stroke-width="1.5"></circle>`;
  }
  // pick-mode overlays
  if(ui.pick){
    const {mode,keys}=ui.pick;
    if(mode==="hex"){
      for(const id of keys){ const {cx,cy}=hexCenter(id);
        const pts=hexCorners(id).map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ");
        s+=`<polygon points="${pts}" class="pick-ring" fill="var(--accent)" fill-opacity="0.14"></polygon>`;
        s+=`<polygon class="hit" data-kind="hex" data-key="${id}" points="${pts}"></polygon>`;
      }
    } else if(mode==="edge"){
      for(const ek of keys){ const e=g.edges[ek]; if(!e)continue;
        const a=g.verts[e.v[0]],c=g.verts[e.v[1]];
        s+=`<line class="pick-edge" x1="${a.x}" y1="${a.y}" x2="${c.x}" y2="${c.y}"></line>`;
        s+=`<line class="hit" data-kind="edge" data-key="${ek}" x1="${a.x}" y1="${a.y}" x2="${c.x}" y2="${c.y}" stroke="rgba(0,0,0,0.001)" stroke-width="24" stroke-linecap="round"></line>`;
      }
    } else if(mode==="vertex"){
      for(const vk of keys){ const vv=g.verts[vk]; if(!vv)continue;
        s+=`<circle class="pick-ring" cx="${vv.x}" cy="${vv.y}" r="10"></circle>`;
        s+=`<circle class="hit" data-kind="vertex" data-key="${vk}" cx="${vv.x}" cy="${vv.y}" r="16"></circle>`;
      }
    }
  }
  s+=`</svg>`;
  return s;
}

  return `<div class="banner" style="margin:0 0 10px;align-items:flex-start"><span>🎲 <b>${lr.n}</b> (${esc(lr.who)}) — take from the bank: ${
    who.length? who.map(t=>`<b style="color:${t.color}">${esc(t.name)}</b> ${esc(t.parts)}`).join(" · ") : "no cards for the humans"
  }.</span></div>`;
}
function renderScore(){
  const rows=game.players.map(p=>{
    const badges=[];
    if(game.lr.holder===p.id) badges.push(`<span class="badge lr">LR ${game.lr.len}</span>`);
    if(game.la.holder===p.id) badges.push(`<span class="badge la">LA ${game.la.n}</span>`);
    const lead = Math.max(...game.players.map(publicVP))===publicVP(p) && publicVP(p)>0;
    return `<tr>
      <td><span class="who"><span class="chip-color" style="background:${p.color}"></span>${esc(p.name)}${p.isClaude?" 🔒":""}</span>
        ${badges.join(" ")} ${lead?`<span class="badge lead">lead</span>`:""}</td>
      <td class="num" title="public victory points">${publicVP(p)}</td>
      <td class="num" title="resource cards">${p.isClaude
        ? p.cardCount
        : `<span class="cnt"><button class="cbtn" data-act="cadj:${p.id}:-1" aria-label="one fewer card">−</button><b>${p.cardCount}</b><button class="cbtn" data-act="cadj:${p.id}:1" aria-label="one more card">+</button></span>`}</td>
      <td class="num" title="dev cards (unplayed)">${p.devCount}</td>
      <td class="num" title="knights played">${p.knightsPlayed}</td>
    </tr>`;
  }).join("");
  return `<table class="score"><thead><tr><th>Player</th><th class="num">VP</th><th class="num">Cards</th><th class="num">Dev</th><th class="num">Kn</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="hint" style="margin-top:8px">VP shown is public — Claude's Victory-Point dev cards stay hidden until they'd win. Use −/+ to keep each human card count matching the real hand.</div>`;
}

function steppers(ctx, vals, {min=0,max=20,only=RES}={}){
  return `<div class="res-steppers" data-steppers="${ctx}">` + only.map(r=>`
    <div class="stepper">
      <div class="rname" style="color:${RES_META[r].color}">${RES_META[r].label}</div>
      <div class="rv" data-rv="${r}">${vals[r]||0}</div>
      <div class="pm"><button data-step="${r}:-1" aria-label="less ${r}">−</button><button data-step="${r}:1" aria-label="more ${r}">+</button></div>
    </div>`).join("") + `</div>`;
}
function draft(ctx){
  ui.drafts = ui.drafts || {};
  ui.drafts[ctx] = ui.drafts[ctx] || {wood:0,brick:0,sheep:0,wheat:0,ore:0};
  return ui.drafts[ctx];
}

  if(c.isClaude){

  }
  return renderHumanMenu();

function renderRobber(){
  const pd=game.pending;
  if(pd.step==="discard"){
    const rows=pd.discards.map(x=>{
      const p=playerById(x.pid);
      if(p.isClaude) return `<div class="offer"><div class="terms">Claude discards <b>${x.n}</b> (done automatically).</div></div>`;
      return `<div class="offer"><div class="terms">${esc(p.name)} discards <b>${x.n}</b> of ${p.cardCount} — set the physical hand aside.</div>
        <button class="btn sm" data-act="ack-discard:${p.id}">Done — ${esc(p.name)} discarded</button></div>`;
    }).join("");
    const remaining = pd.discards.filter(x=>!x.done && !playerById(x.pid).isClaude).length;
    return `<h3 style="font-size:13px;margin-bottom:6px">A 7 was rolled — discards</h3>${rows}
      ${remaining? `<p class="hint">Acknowledge each discard to continue.</p>`:`<button class="btn primary" data-act="robber-to-move">Continue to robber</button>`}`;
  }
  if(pd.step==="move"){
    if(playerById(pd.mover).isClaude) return `<p class="hint">Claude is choosing where to move the robber…</p>`;
    return `<h3 style="font-size:13px;margin-bottom:6px">Move the robber</h3>
      <p class="hint">${esc(playerById(pd.mover).name)} clicks a highlighted hex.</p>
      <button class="btn" data-act="pick-robber">Highlight hexes</button>`;
  }
  if(pd.step==="steal"){
    if(playerById(pd.mover).isClaude) return `<p class="hint">Claude is choosing whom to rob…</p>`;
    const cands=pd.stealCandidates.map(pid=>{
      const p=playerById(pid);
      return `<button class="btn" data-act="steal:${pid}">Steal from ${esc(p.name)} (${p.cardCount})</button>`;
    }).join("");
    return `<h3 style="font-size:13px;margin-bottom:6px">Steal a card</h3>
      <div class="actions-grid">${cands || `<span class="hint">No one to steal from.</span>`}
      <button class="btn ghost" data-act="steal:none">Steal from no one</button></div>`;
  }
  if(pd.step==="stealReveal"){
    const p=playerById(pd.revealTo);
    if(pd.claudeRobbedHuman){
      return `<h3 style="font-size:13px;margin-bottom:6px">Claude robbed ${esc(playerById(pd.victim).name)}</h3>
        <p class="hint">${esc(playerById(pd.victim).name)}: tap the resource Claude took (others, look away). It enters Claude's hidden hand.</p>
        <div class="actions-grid">${RES.map(r=>`<button class="btn" data-act="claude-took:${r}">${RES_META[r].label}</button>`).join("")}</div>`;
    }
    return `<h3 style="font-size:13px;margin-bottom:6px">${esc(p.name)} stole from Claude</h3>
      <p class="hint">Reveal to ${esc(p.name)} only — others look away.</p>
      <button class="btn" data-act="reveal-steal">${ui.revealShown? RES_META[pd.stolen].label : "Reveal the stolen card"}</button>
      ${ui.revealShown? `<button class="btn primary" style="margin-left:8px" data-act="robber-done">Continue</button>`:""}`;
  }
  return "";
}

function renderConfigBoard(){
  const c=ui.cfg;
  const HEXFILL={wood:"#3f6b3a",brick:"#b3623f",sheep:"#8fae5d",wheat:"#d8a53a",ore:"#7d8a99",desert:"#d9c9a3"};
  // temporary geometry just for drawing
  const tmp=[]; let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(let id=1;id<=19;id++){ const cs=hexCorners(id); for(const [x,y] of cs){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);} }
  const pad=c.ports==="custom"?40:20;
  let s=`<svg class="board" viewBox="${minX-pad} ${minY-pad} ${maxX-minX+pad*2} ${maxY-minY+pad*2}">`;
  s+=`<rect x="${minX-pad}" y="${minY-pad}" width="${maxX-minX+pad*2}" height="${maxY-minY+pad*2}" rx="10" fill="var(--sea)"></rect>`;
  for(let id=1;id<=19;id++){
    const h=c.hexes[id-1]; const {cx,cy}=hexCenter(id);
    const pts=hexCorners(id).map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ");
    const isStart = c.tokenMode==="spiral" && (c.spiralStart||1)===id;
    s+=`<polygon class="hit" data-kind="cfg-hex" data-key="${id}" points="${pts}" fill="${HEXFILL[h.r]}" stroke="${isStart?'var(--accent)':'rgba(0,0,0,.25)'}" stroke-width="${isStart?4:1.5}" style="cursor:pointer;fill-opacity:1"></polygon>`;
    if(h.t) s+=`<circle cx="${cx}" cy="${cy}" r="13" fill="var(--token)"></circle><text class="tok-num" x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="${h.t===6||h.t===8?'var(--red-num)':'var(--token-ink)'}">${h.t}</text>`;
    else s+=`<text x="${cx}" y="${cy+3}" text-anchor="middle" font-size="10" fill="rgba(0,0,0,.5)">desert</text>`;
  }
  if(c.ports==="custom"){
    const g=computeGeom(), pl=c.portList||[];
    for(const ek of g.perim){
      const e=g.edges[ek], a=g.verts[e.v[0]], b=g.verts[e.v[1]], has=pl.find(x=>x.edge===ek);
      if(!has) s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 5"></line>`;
    }
    for(const x of pl){
      const e=g.edges[x.edge]; if(!e) continue;
      const dx=e.mx-g.view.cx, dy=e.my-g.view.cy, L=Math.hypot(dx,dy)||1;
      const ox=e.mx+dx/L*22, oy=e.my+dy/L*22;
      for(const vk of e.v){ const vv=g.verts[vk]; s+=`<line x1="${vv.x}" y1="${vv.y}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="rgba(255,255,255,.7)" stroke-width="2"></line>`; }
      s+=`<circle cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"></circle>`;
      s+=`<text x="${ox.toFixed(1)}" y="${(oy+3).toFixed(1)}" text-anchor="middle" font-size="8" font-family="IBM Plex Mono, monospace" fill="var(--ink)">${x.type==="3:1"?"3:1":x.type.slice(0,2)}</text>`;
    }
    for(const ek of g.perim){
      const e=g.edges[ek], a=g.verts[e.v[0]], b=g.verts[e.v[1]];
      s+=`<line class="hit" data-kind="cfg-edge" data-key="${ek}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(0,0,0,0.001)" stroke-width="22" stroke-linecap="round" style="cursor:pointer"></line>`;
    }
  }
  s+=`</svg>`;
  if(ui.cfgEdit!=null){
    const h=c.hexes[ui.cfgEdit-1];
    s+=`<div class="offer" style="margin-top:8px"><div class="terms">Hex ${ui.cfgEdit}</div>
      <div class="actions-grid" style="grid-template-columns:repeat(3,1fr)">
      ${["wood","brick","sheep","wheat","ore","desert"].map(r=>`<button class="btn sm ${h.r===r?'primary':''}" data-act="cfg-res:${r}">${r}</button>`).join("")}
      </div>
      <div class="inline" style="margin-top:8px"><label class="hint">number</label>
      <select data-act-sel="cfg-tok">${[0,2,3,4,5,6,8,9,10,11,12].map(n=>`<option value="${n}" ${h.t===n?'selected':''}>${n||'—'}</option>`).join("")}</select>
      <button class="btn sm ghost" data-act="cfg-edit-close">close</button></div></div>`;
  }
  return s;
}

function onConfigClick(e){
  const hit=e.target.closest("[data-act],[data-kind]"); if(!hit) return;
  if(hit.dataset.kind==="cfg-edge"){
    const ek=hit.dataset.key, order=["3:1","wood","brick","sheep","wheat","ore"];
    const pl=ui.cfg.portList||(ui.cfg.portList=[]);
    const i=pl.findIndex(x=>x.edge===ek);
    if(i<0) pl.push({edge:ek,type:order[0]});
    else { const n=order.indexOf(pl[i].type)+1; if(n>=order.length) pl.splice(i,1); else pl[i].type=order[n]; }
    render(); return;
  }
  if(hit.dataset.kind==="cfg-hex"){
    const id=+hit.dataset.key;
    if(ui.cfg.tokenMode==="spiral"){ ui.cfg.spiralStart=id; applyARSpiral(); }
    else { ui.cfgEdit=id; render(); }
    return;
  }
  const [act,arg]=(hit.dataset.act||"").split(":");
  if(act==="cfg-standard"){ ui.cfg.hexes=clone(STANDARD_BOARD); if(ui.cfg.tokenMode==="spiral") applyARSpiral(); else render(); }
  else if(act==="cfg-random"){ ui.cfg.hexes=randomBoard(); if(ui.cfg.tokenMode==="spiral") applyARSpiral(); else render(); }
  else if(act==="cfg-res"){ ui.cfg.hexes[ui.cfgEdit-1].r=arg; if(arg==="desert")ui.cfg.hexes[ui.cfgEdit-1].t=0; if(ui.cfg.tokenMode==="spiral") applyARSpiral(); else render(); }
  else if(act==="cfg-edit-close"){ ui.cfgEdit=null; render(); }
  else if(act==="cfg-tokenmode"){ ui.cfg.tokenMode=arg; ui.cfgEdit=null; if(arg==="spiral"){ ui.cfg.spiralStart=ui.cfg.spiralStart||1; ui.cfg.spiralDir=ui.cfg.spiralDir||"cw"; applyARSpiral(); } else render(); }
  else if(act==="cfg-spiraldir"){ ui.cfg.spiralDir=arg; applyARSpiral(); }
  else if(act==="cfg-apply-spiral"){ applyARSpiral(); }
  else if(act==="cfg-back"){ if(ui._prevGame){ game=ui._prevGame; ui={}; render(); } }
  else if(act==="cfg-start"){ startFromConfig(); }
}
function applyARSpiral(){
  const c=ui.cfg;
  const order=spiralOrder(c.spiralStart||1, c.spiralDir||"cw");
  let ni=0;
  for(const id of order){
    const h=c.hexes[id-1];
    if(h.r==="desert"){ h.t=0; continue; }
    h.t = AR_NUMBERS[ni++] || 0;
  }
  render();
}
function randomBoard(){
  const bag=[]; for(const [r,n] of [["wood",4],["brick",3],["sheep",4],["wheat",4],["ore",3]]) for(let i=0;i<n;i++) bag.push(r);
  bag.push("desert");
  for(let i=bag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [bag[i],bag[j]]=[bag[j],bag[i]]; }
  const toks=[2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];
  for(let i=toks.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [toks[i],toks[j]]=[toks[j],toks[i]]; }
  let ti=0;
  return bag.map(r=>({r, t: r==="desert"?0:toks[ti++]}));
}

  game.phase="setup";

/* ============================================================ ACTIONS */
function onAppClick(e){
  const hit=e.target.closest("[data-act]"); if(!hit) return;
  const parts=(hit.dataset.act||"").split(":");
  const act=parts[0], a1=parts[1], a2=parts[2];
  const c=cur();
  if(game && !NO_SNAP.has(act)) snapshot((SNAP_LABEL[act]||(()=>act))(a1));
  switch(act){
    case "new": startConfig(); break;
    case "dismiss-import": ui.importErr=null; render(); break;
    case "reveal-deck": game.dev.revealed=true; renderFairness(); break;
    case "cancel-claude": ui.cancelClaude=true; if(ui._abort) ui._abort.abort(); break;

    /* setup */
    case "set-starter": chooseStarter(a1); break;
    case "set-first": choosePlayFirst(a1); break;
    case "claude-setup": claudeSetupPlace(); break;
    case "pick-setup-settlement": {
      const pid=game.setup.order[game.setup.step];
      beginPick("vertex", legalSettlementVertices(pid,{setup:true}), (k,key)=>placeSetupSettlement(pid,key));
      break;
    }
    case "pick-setup-road": {
      const pid=game.setup.order[game.setup.step];
      beginPick("edge", legalRoadEdges(pid,{setup:true,fromVertex:game.setup.lastSettlement}), (k,key)=>placeSetupRoad(pid,key));
      break;
    }

    /* roll */
    case "apply-roll": { const n=+$("#roll-val").value; resolveRoll(n,false); break; }
    case "claude-turn": runClaudeTurn(); break;
    case "claude-resume": resumeClaudeTurn(); break;
    case "claude-end": if(cur().isClaude && !ui.busy) endTurn(); break;

    /* build */
    case "build": startBuild(a1); break;
    case "buy-dev": humanBuyDev(); break;
    case "pick-road-free":
      beginPick("edge", legalRoadEdges(c.id), (k,key)=>{ placeRoad(c.id,key,true); ui.rbPlaced=(ui.rbPlaced||0)+1;
        if(ui.rbPlaced>=2){ ui.sub=null; ui.rbPlaced=0; } commit(); });
      break;

    /* subpanels */
    case "sub": ui.sub=a1; ui.tradeResult=null; clearDrafts(); commit(); break;
    case "sub-cancel": ui.sub=null; clearDrafts(); ui.tradeResult=null; ui.rbPlaced=0; commit(); break;

    case "do-bank": doBankTrade(); break;
    case "do-th": doHumanTrade(); break;
    case "tc-send": sendTradeToClaude(); break;
    case "tc-apply": if(ui.tradeResult&&ui.tradeResult.apply){ ui.tradeResult.apply(); ui.sub=null; ui.tradeResult=null; clearDrafts(); commit(); } break;

    case "play-dev": humanPlayDev(a1); break;
    case "do-yop": {
      const v=draft("yop"); if(sum(v)!==2){ flash("Pick exactly 2."); return; }
      gainRes(c,v); logLine(`${c.name} took ${RES.filter(r=>v[r]).map(r=>v[r]+" "+RES_META[r].label).join(", ")} (Year of Plenty).`);
      c.playedDevThisTurn=true; c.devCount=Math.max(0,c.devCount-1); ui.sub=null; clearDrafts(); commit(); break;
    }
    case "do-mono": startMonopoly(c.id, a1); break;
    case "mono-adj": {
      const pid=a1, d=+a2, p=playerById(pid);
      ui.mono.amounts[pid]=Math.max(0, Math.min(p.cardCount, (ui.mono.amounts[pid]||0)+d));
      commit(); break;
    }
    case "mono-apply": applyMonopoly(); break;
    case "cadj": { const p=playerById(a1); if(p&&!p.isClaude){ p.cardCount=Math.max(0,p.cardCount+(+a2)); commit(); } break; }

    case "end-turn": endTurn(); break;

    /* robber */
    case "ack-discard": { const x=game.pending.discards.find(d=>d.pid===a1); if(x){ x.done=true; playerById(a1).cardCount=Math.max(0,playerById(a1).cardCount-x.n); logLine(`${playerById(a1).name} discarded ${x.n}.`);} maybeRobberAdvance(); break; }
    case "robber-to-move": game.pending.step="move"; commit(); break;
    case "pick-robber":
      beginPick("hex", game.board.hexes.map(h=>h.id).filter(id=>id!==game.board.robberHex), (k,key)=>moveRobber(+key));
      break;
    case "steal": doSteal(a1); break;
    case "claude-took": { const r=a1; const cl=game.players.find(p=>p.isClaude);
      cl.hand[r]++; cl.cardCount++; const v=playerById(game.pending.victim); v.cardCount=Math.max(0,v.cardCount-1);
      logLine(`Claude robbed ${v.name}.`,"claude"); finishRobber(); break; }
    case "reveal-steal": ui.revealShown=true; render(); break;
    case "robber-done": finishRobber(); break;

    /* claude offers */
    case "accept-offer": acceptClaudeOffer(+a1,a2); break;
    case "decline-offer": { game.pending.offers.splice(+a1,1); if(!game.pending.offers.length){ game.pending=null; afterClaudeOffers(); } else commit(); break; }
    case "offers-done": game.pending=null; afterClaudeOffers(); break;

    case "cancel": break;
  }
}
function flash(msg){ logLine(msg); render(); }
function startConfig(){
  const prev = (game && game.phase && game.phase!=="config" && !game.isExample && game.phase!=="over") ? game : null;
  ui={ cfg:{names:["Player 1","Player 2","Claude"], claudeIdx:2, protectRounds:2, ports:"standard", hexes:clone(STANDARD_BOARD)}, _prevGame:prev };
  game={phase:"config"};

}

/* ---------------- setup flow ---------------- */
function chooseStarter(sel){
  let s;
  if(sel==="random"){ s=rint(3); logLine(`Randomly chose ${game.players[s].name} to place first.`,"rng"); }
  else { s=game.players.findIndex(p=>p.id===sel); if(s<0) s=0; logLine(`${game.players[s].name} places first.`); }
  const cw=[s,(s+1)%3,(s+2)%3];
  const order=[...cw, ...cw.slice().reverse()].map(i=>game.players[i].id);
  game.setup.order=order;
  game.setup.pickStarter=false;
  game.setup.step=0;
  game.setup.phase="settlement";
  game.setup.lastSettlement=null;
  logLine("Order: "+order.slice(0,3).map(id=>playerById(id).name).join(" → ")+"  then back  "+order.slice(3).map(id=>playerById(id).name).join(" → ")+".","big");
  commit();
  const first=playerById(order[0]);
  if(first.isClaude && sampleFn!==null) setTimeout(claudeSetupPlace,300);
  else setupAutoPick();
}
function placeSetupSettlement(pid,key){
  const p=playerById(pid);
  p.settlements.push(key);
  game.setup.lastSettlement=key;
  game.setup.phase="road";
  logLine(`${p.name} places a settlement at ${vDesc(key)}.`);
  if(game.setup.step>=3){ // second placement → starting resources
    const g=game.board.geom, got={};
    for(const id of g.verts[key].hexes){
      const h=game.board.hexes[id-1];
      if(h.resource!=="desert") got[h.resource]=(got[h.resource]||0)+1;
    }
    gainRes(p,got);
    logLine(`${p.name} collects starting resources: ${RES.filter(r=>got[r]).map(r=>got[r]+" "+RES_META[r].label).join(", ")||"none"}.`);
  }
  commit();
  setupAutoPick();
}
function placeSetupRoad(pid,key){
  const p=playerById(pid);
  p.roads.push(key);
  logLine(`${p.name} places a road.`);
  advanceSetup();
}
/* highlight the legal spots automatically for a human's setup turn */
function setupAutoPick(){
  if(!game || game.phase!=="setup" || game.setup.pickStarter) return;
  const pid=game.setup.order[game.setup.step], p=playerById(pid);
  if(!p || p.isClaude) return;
  if(game.setup.phase==="settlement"){
    beginPick("vertex", legalSettlementVertices(pid,{setup:true}), (k,key)=>placeSetupSettlement(pid,key));
  } else {
    beginPick("edge", legalRoadEdges(pid,{setup:true,fromVertex:game.setup.lastSettlement}), (k,key)=>placeSetupRoad(pid,key));
  }
}
function advanceSetup(){
  game.setup.step++;
  game.setup.phase="settlement";
  game.setup.lastSettlement=null;
  if(game.setup.step>=6){
    game.phase="play"; game.pickPlayFirst=true; game.startIdx=0;
    game.currentIdx=0; game.turn=1; game.round=1;
    recomputeAll();
    logLine("Setup complete — roll two dice to see who plays first.","big");
  }
  commit();
  if(game.phase==="setup"){
    const pid=game.setup.order[game.setup.step];
    if(playerById(pid).isClaude && sampleFn!==null && !ui.busy) setTimeout(claudeSetupPlace,300);
    else setupAutoPick();

function choosePlayFirst(sel){

/* ---------------- roll resolution ---------------- */
function resolveRoll(n, isClaude){
  // house rule: no 7s in the first N rounds — roll again
  if(n===7 && game.round<=game.config.protectRounds){
    game.pendingRoll=null;
    logLine(`${cur().name} rolled 7 — roll again (no 7s in the first ${game.config.protectRounds} round${game.config.protectRounds===1?"":"s"}).`, isClaude?"claude":"");
    commit();
    return "reroll";
  }
  game.pendingRoll=n;
  game.lastRoll={ n, who:cur().name, take:null };
  game.players.forEach(p=>p.playedDevThisTurn=p.playedDevThisTurn||false);
  logLine(`${cur().name} rolled ${n}.`, isClaude?"claude":"");
  if(n===7){ startRobber(cur().id); return; }
  const gain=applyProduction(n);
  game.lastRoll={ n, who:cur().name, take:game.players.filter(p=>!p.isClaude).map(p=>({
    name:p.name, color:p.color,
    parts:RES.filter(r=>gain[p.id][r]).map(r=>`${gain[p.id][r]} ${RES_META[r].label.toLowerCase()}`).join(", ") })) };
  logLine("Production — "+gainSummary(gain), isClaude?"claude":"");
  commit();
}

/* ---------------- robber ---------------- */
function startRobber(moverId,{knight=false}={}){   // a Knight moves the robber and steals — no discards (only a rolled 7 forces them)
  const discards=[];
  for(const p of game.players){
    if(!knight && p.cardCount>7){
      const nn=Math.floor(p.cardCount/2);
      if(p.isClaude){
        for(let i=0;i<nn;i++){ const r=drawRandomKey(p.hand); if(r){ p.hand[r]--; } }
        p.cardCount=sum(p.hand);
        game.rng.log.push({kind:"discard",pid:p.id,n:nn});
        logLine(`Claude discards ${nn} (random).`,"rng");
        discards.push({pid:p.id,n:nn,done:true});
      }else{
        discards.push({pid:p.id,n:nn,done:false});
      }
    }
  }
  game.pending={type:"robber", mover:moverId, discards, step: discards.some(d=>!d.done)?"discard":"move"};
  commit();
}
/* card counts can be corrected (−/+) while discards are pending — keep the prompt in step with them */
function refreshDiscards(){
  const pd=game.pending;
  if(!pd || pd.type!=="robber" || pd.step!=="discard") return;
  let changed=false;
  for(const x of pd.discards){
    if(x.done) continue;
    const p=playerById(x.pid); if(p.isClaude) continue;
    if(p.cardCount<=7){ x.done=true; changed=true; logLine(`${p.name} has ${p.cardCount} cards — no discard needed.`); }
    else{ const n=Math.floor(p.cardCount/2); if(n!==x.n){ x.n=n; changed=true; } }
  }
  if(pd.discards.every(d=>d.done)){ pd.step="move"; changed=true; }
  if(changed) save();
}
function maybeRobberAdvance(){
  if(game.pending.discards.every(d=>d.done)) game.pending.step="move";
  commit();
  if(game.pending && game.pending.step==="move" && cur().isClaude && sampleFn!==null && !ui.busy){
    ui.busy=true; render();
    claudeRobberDecision();
  }
}
function moveRobber(hexId){
  game.board.robberHex=hexId;
  const h=game.board.hexes[hexId-1];
  logLine(`${playerById(game.pending.mover).name} moves the robber to ${h.resource==="desert"?"the desert":RES_META[h.resource].label+"-"+h.token}.`);
  // steal candidates: players (not mover) with a building on that hex and >0 cards
  const g=game.board.geom, b=allBuildings(), set=new Set();
  for(const k in g.verts){ if(!g.verts[k].hexes.includes(hexId)) continue; const o=b[k]; if(o && o.pid!==game.pending.mover) set.add(o.pid); }
  const cands=[...set].filter(pid=>playerById(pid).cardCount>0);
  game.pending.stealCandidates=cands;
  game.pending.step="steal";
  commit();
  // if mover is Claude, Claude picks target automatically via runClaudeTurn continuation
}
function doSteal(targetId){
  const pd=game.pending, mover=playerById(pd.mover);
  if(targetId==="none"){ logLine(`${mover.name} steals from no one.`); finishRobber(); return; }
  const victim=playerById(targetId);
  if(victim.isClaude){
    // mover (human) takes a random card from Claude's hidden hand
    const r=drawRandomKey(victim.hand);
    game.rng.log.push({kind:"steal",from:"claude",to:mover.id,res:r});
    if(r){ victim.hand[r]--; victim.cardCount=sum(victim.hand); }
    pd.step="stealReveal"; pd.revealTo=mover.id; pd.stolen=r; pd.claudeRobbedHuman=false;
    if(!mover.isClaude){ mover.cardCount++; } // mover gains a (physical) card
    ui.revealShown=false;
    commit();
  }else if(mover.isClaude){
    // Claude robs a human → that human taps what was taken
    pd.step="stealReveal"; pd.victim=targetId; pd.claudeRobbedHuman=true;
    commit();
  }else{
    // human robs human
    victim.cardCount=Math.max(0,victim.cardCount-1); mover.cardCount++;
    logLine(`${mover.name} steals 1 card from ${victim.name}.`);
    finishRobber();
  }
}
function finishRobber(){
  const wasClaudeTurn = playerById(game.pending.mover).isClaude;
  game.pending=null; ui.revealShown=false;
  commit();
  if(wasClaudeTurn && ui.claudeResume){ const f=ui.claudeResume; ui.claudeResume=null; setTimeout(f,200); }
}

/* ---------------- build ---------------- */
function startBuild(kind){
  const c=cur();
  if(kind==="road") beginPick("edge", legalRoadEdges(c.id), (k,key)=>placeRoad(c.id,key,false));
  if(kind==="settlement") beginPick("vertex", legalSettlementVertices(c.id), (k,key)=>placeSettlement(c.id,key));
  if(kind==="city") beginPick("vertex", legalCityVertices(c.id), (k,key)=>placeCity(c.id,key));
}
function placeRoad(pid,key,free){
  const p=playerById(pid);
  if(!free){ if(!canAffordCount(p,COST.road)){ flash("Can't afford a road."); return; } payCost(p,COST.road); }
  p.roads.push(key);
  logLine(`${p.name} builds a road${free?" (free)":""}.`);
  recomputeAll(); checkWinFor(p); commit();
}
function placeSettlement(pid,key){
  const p=playerById(pid);
  if(!canAffordCount(p,COST.settlement)){ flash("Can't afford a settlement."); return; }
  payCost(p,COST.settlement); p.settlements.push(key);
  logLine(`${p.name} builds a settlement at ${vDesc(key)}.`);
  recomputeAll(); checkWinFor(p); commit();
}
function placeCity(pid,key){
  const p=playerById(pid);
  if(!canAffordCount(p,COST.city)){ flash("Can't afford a city."); return; }
  const i=p.settlements.indexOf(key); if(i<0){ flash("No settlement there."); return; }
  payCost(p,COST.city); p.settlements.splice(i,1); p.cities.push(key);
  logLine(`${p.name} upgrades to a city at ${vDesc(key)}.`);
  recomputeAll(); checkWinFor(p); commit();
}
function humanBuyDev(){
  const c=cur();
  if(!canAffordCount(c,COST.dev)){ flash("Can't afford a dev card."); return; }
  payCost(c,COST.dev); c.devCount++; c.devBoughtThisTurn=(c.devBoughtThisTurn||0)+1;

}
function humanPlayDev(type){
  const c=cur();
  if(type==="vp"){ c.vpCards++; logLine(`${c.name} reveals a Victory Point card.`); if(checkWinFor(c)){commit();return;} c.devCount=Math.max(0,c.devCount-1); ui.sub=null; commit(); return; }
  if(c.playedDevThisTurn){ flash("Only one development card per turn."); return; }
  if(c.devCount - (c.devBoughtThisTurn||0) < 1){ flash("You can't play a card bought this turn — wait until your next turn."); return; }
  if(type==="knight"){
    c.knightsPlayed++; c.playedDevThisTurn=true; c.devCount=Math.max(0,c.devCount-1);
    logLine(`${c.name} plays a Knight.`);
    updateLargestArmy(); checkWinFor(c);
    ui.sub=null; startRobber(c.id,{knight:true}); return;
  }
  if(type==="road"){ c.playedDevThisTurn=true; c.devCount=Math.max(0,c.devCount-1); logLine(`${c.name} plays Road Building.`); ui.sub="roadbuild"; ui.rbPlaced=0; commit(); return; }
  if(type==="plenty"){ ui.sub="yop"; clearDrafts(); commit(); return; }
  if(type==="mono"){ ui.sub="mono"; commit(); return; }
}
/* Monopoly — inline collection panel, works for a human OR Claude as the player */
function startMonopoly(byId, res){
  if(!RES.includes(res)) return false;
  const by=playerById(byId);
  if(by.isClaude){
    const di=(by.devCards||[]).findIndex(d=>d.type==="mono" && d.boughtTurn<game.turn);
    if(di<0){ logLine("Claude has no playable Monopoly.","claude"); return false; }
    by.devCards.splice(di,1);
  }
  by.devCount=Math.max(0,by.devCount-1);
  by.playedDevThisTurn=true;
  const humans=game.players.filter(p=>!p.isClaude && p.id!==byId).map(p=>p.id);
  ui.mono={ by:byId, res, humans, amounts:{} };
  humans.forEach(pid=>ui.mono.amounts[pid]=0);
  ui.sub=null;
  commit();
  return true;
}
function applyMonopoly(){
  const m=ui.mono; if(!m) return;
  const by=playerById(m.by), r=m.res, cl=game.players.find(p=>p.isClaude);
  let got=0;
  for(const pid of m.humans){ const q=Math.max(0,m.amounts[pid]||0); playerById(pid).cardCount-=q; got+=q; }
  if(cl && cl.id!==m.by){ got+=cl.hand[r]; cl.hand[r]=0; cl.cardCount=sum(cl.hand); }
  by.cardCount+=got; if(by.isClaude) by.hand[r]+=got;
  logLine(`${by.name} played Monopoly on ${RES_META[r].label} — collected ${got}.`, by.isClaude?"claude":"");
  const wasClaude=by.isClaude;
  ui.mono=null;
  checkWinFor(by);
  commit();
  if(wasClaude && ui.claudeResume){ const f=ui.claudeResume; ui.claudeResume=null; setTimeout(f,150); }
}

/* ---------------- trades ---------------- */
function doBankTrade(){
  const c=cur(), give=draft("bank-give"), get=draft("bank-get");
  const rates=portRatesFor(c.id);
  let cost=0; for(const r of RES){ if(give[r]% rates[r]!==0){ flash(`${RES_META[r].label} must be given in multiples of ${rates[r]}.`); return; } cost+=give[r]/rates[r]; }
  if(cost<=0 || cost!==sum(get)){ flash("Trade isn't balanced for your rates."); return; }
  if(c.isClaude && !RES.every(r=>c.hand[r]>=give[r])){ flash("Claude doesn't have those cards."); return; }
  if(sum(give)>c.cardCount){ flash("Not enough cards."); return; }
  payCost(c,give); gainRes(c,get);
  logLine(`${c.name} trades ${RES.filter(r=>give[r]).map(r=>give[r]+" "+RES_META[r].label).join(", ")} → ${RES.filter(r=>get[r]).map(r=>get[r]+" "+RES_META[r].label).join(", ")} with the bank.`);
  ui.sub=null; clearDrafts(); commit();
}
function doHumanTrade(){
  const c=cur();
  const tid=$("#th-target")?.value; const other=tid?playerById(tid):null;
  const give=draft("th-give"), get=draft("th-get");
  if(!other){ flash("No other player."); return; }
  if(sum(give)>c.cardCount || sum(get)>other.cardCount){ flash("Someone doesn't have those cards."); return; }
  c.cardCount-=sum(give); c.cardCount+=sum(get);
  other.cardCount-=sum(get); other.cardCount+=sum(give);
  if(c.isClaude){ for(const r of RES){ c.hand[r]-=give[r]; c.hand[r]+=get[r]; } }
  if(other.isClaude){ for(const r of RES){ other.hand[r]-=get[r]; other.hand[r]+=give[r]; } }
  logLine(`${c.name} ↔ ${other.name}: ${RES.filter(r=>give[r]).map(r=>give[r]+" "+RES_META[r].label).join(", ")||"nothing"} for ${RES.filter(r=>get[r]).map(r=>get[r]+" "+RES_META[r].label).join(", ")||"nothing"}.`);
  ui.sub=null; clearDrafts(); commit();
}

/* ---------------- end turn ---------------- */
function endTurn(){
  const c=cur();
  if(checkWinFor(c)){ commit(); return; }
  c.playedDevThisTurn=false; c.devBoughtThisTurn=0;
  game.pendingRoll=null; game.pending=null; ui.sub=null; clearDrafts(); ui.rbPlaced=0; ui.claudeResume=null;
  game.currentIdx=(game.currentIdx+1)%3;
  game.turn++;
  if(game.currentIdx===(game.startIdx||0)) game.round++;
  recomputeAll();
  logLine(`— ${cur().name}'s turn (turn ${game.turn}, round ${game.round}) —`);
  commit();
  if(cur().isClaude && sampleFn!==null && !game.isExample) setTimeout(runClaudeTurn, 400);
}

/* ---- state serialization for Claude ---- */
function claudeStateView(){
  const g=game.board.geom, cl=game.players.find(p=>p.isClaude);
  const b=allBuildings();
  const prodByRes = (pid)=>{
    const m={wood:0,brick:0,sheep:0,wheat:0,ore:0}; const P=playerById(pid);
    for(const k of [...P.settlements,...P.cities]){
      const mult = P.cities.includes(k)?2:1;
      for(const id of (g.verts[k]?.hexes||[])){ const h=game.board.hexes[id-1]; if(h.resource!=="desert" && h.id!==game.board.robberHex) m[h.resource]+=pips(h.token)*mult; }
    }
    return m;
  };
  return {
    you: cl.name, turn:game.turn, round:game.round,
    sevensLive: game.round>game.config.protectRounds,
    robberOn: (()=>{ const h=game.board.hexes[game.board.robberHex-1]; return h.resource==="desert"?"desert":RES_META[h.resource].label+"-"+h.token; })(),
    longestRoad: game.lr.holder? {holder:playerById(game.lr.holder).name, len:game.lr.len} : null,
    largestArmy: game.la.holder? {holder:playerById(game.la.holder).name, knights:game.la.n} : null,
    yourHand: cl.hand,
    yourDevCards: (cl.devCards||[]).map(d=>d.type),
    yourPlayableDev: (cl.devCards||[]).filter(d=>d.type!=="vp" && d.boughtTurn<game.turn).map(d=>d.type),
    yourHiddenVP: cl.vpCards,
    yourPorts: game.board.ports.filter(p=>p.verts.some(v=>[...cl.settlements,...cl.cities].includes(v))).map(p=>p.type),
    yourProduction: prodByRes(cl.id),
    players: game.players.map(p=>({
      name:p.name, isYou:p.isClaude, publicVP:publicVP(p),
      resourceCards:p.cardCount, devCards:p.devCount, knightsPlayed:p.knightsPlayed,
      settlements:p.settlements.map(vDesc), cities:p.cities.map(vDesc), roads:p.roads.length,
      productionPips: prodByRes(p.id),
    })),
    recentLog: game.log.slice(-10).map(e=>e.text),
  };
}
function legalMenu(){
  const cl=game.players.find(p=>p.isClaude);
  const mapK = arr => arr.map(k=>({key:k, at:vDesc(k)}));
  const mapE = arr => arr.map(k=>({key:k, at:eDesc(k)}));
  return {
    buildRoad: canAffordCount(cl,COST.road)&&cl.roads.length<15 ? mapE(legalRoadEdges(cl.id)) : [],
    buildSettlement: canAffordCount(cl,COST.settlement)&&cl.settlements.length<5 ? mapK(legalSettlementVertices(cl.id)) : [],
    buildCity: canAffordCount(cl,COST.city)&&cl.cities.length<4 ? mapK(legalCityVertices(cl.id)) : [],
    canBuyDev: canAffordCount(cl,COST.dev) && game.dev.deck.length>0,
    playableDev: (cl.devCards||[]).filter(d=>d.type!=="vp"&&d.boughtTurn<game.turn).map(d=>d.type).filter(t=>t!=="knight"),
    bankRates: portRatesFor(cl.id),

  };
}

Rules: I execute actions in order and re-check legality; skip means skipped. Buy/build only what you can pay for in sequence. Do not include a Knight action here (knights are handled before the roll). Keep it to the strongest 1-4 actions. If nothing is worth doing, return {"actions":[],"endReason":"..."}.`;
